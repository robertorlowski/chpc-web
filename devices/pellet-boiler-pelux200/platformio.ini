; Sterownik pieca Pellux 200 (typ pellet-boiler-pelux200): ESP32-C3 SuperMini i modul
; RS-485 HW-519 na magistrali ecoMAX panelu kotla. Opis: README.md.

[platformio]
; Srodowisko native istnieje tylko dla `pio test -e native`.
default_envs = esp32c3

; Konsola i wgrywanie przez wbudowane USB plytki (USB CDC); odbior magistrali na GPIO21.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
	Links2004/WebSockets@^2.3.6

[env:native]
platform = native
test_framework = unity
; Testy wlaczaja potrzebne pliki .cpp bezposrednio, wiec src nie jest budowane.
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src
	-Wall
	-Wextra
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-9
lib_deps = bblanchon/ArduinoJson@^7.3.0
