; Sterownik hydroforu (typ water-pressure), ESP32-C3 SuperMini.
; Opis dzialania: docs/water-pressure.md.

[platformio]
; Srodowisko native istnieje tylko dla `pio test -e native`.
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; konsola przez wbudowane USB (USB CDC) plytki SuperMini
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra
lib_deps = bblanchon/ArduinoJson@^7.3.0

[env:native]
platform = native
test_framework = unity
; Testy wlaczaja potrzebne pliki .cpp bezposrednio, wiec src nie jest budowane.
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src
	-Wall
	-Wextra
lib_deps = bblanchon/ArduinoJson@^7.3.0
