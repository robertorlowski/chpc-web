; Sterownik hydroforu (typ water-pressure-tank): ESP32 DevKit z modulem ESP32-WROOM-32.
; Opis: docs/ (czesc 3: podlaczenie, piny, wgranie).

[platformio]
; Srodowisko native istnieje tylko dla `pio test -e native`.
default_envs = esp32dev

; Konsola i wgrywanie przez UART0 (mostek USB na plytce albo przejsciowka USB-TTL
; na pinach TX/RX), przekaznik na GPIO26 (firmware.hpp).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
lib_deps = bblanchon/ArduinoJson@^7.3.0

[env:native]
platform = native
test_framework = unity
; Testy wlaczaja potrzebne pliki .cpp bezposrednio, wiec src nie jest budowane.
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src
	-Wall
	-Wextra
lib_deps = bblanchon/ArduinoJson@^7.3.0
