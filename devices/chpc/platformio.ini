; PlatformIO configuration for CHPC firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
; szkic leży w katalogu głównym repo (nie w src/)
src_dir = .
default_envs = promini

[env:promini]
platform = atmelavr
; Arduino Pro Mini ATmega328P 5V/16MHz (wersja 3.3V/8MHz: pro8MHzatmega328)
board = pro16MHzatmega328
framework = arduino
; kompiluj tylko główny szkic (pomija archiwum/ i docs/)
build_src_filter = -<*> +<CHPC_firmware.ino*>
; analiza statyczna (pio check) bez archiwum/
check_src_filters = -<*> +<CHPC_firmware.ino*>
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	; tylko dla DISPLAY_096:
	; greiman/SSD1306Ascii
monitor_speed = 9600
upload_speed = 57600
