; PlatformIO configuration for CHPC firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = promini

[env:promini]
platform = atmelavr
; Arduino Pro Mini ATmega328P 5V/16MHz (wersja 3.3V/8MHz: pro8MHzatmega328)
board = pro16MHzatmega328
framework = arduino
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
monitor_speed = 9600
upload_speed = 57600

; Firmware do symulacji Wokwi (test-wokwi): tryb RS485_HUMAN, bo scenariusze czekają na komunikaty
; tekstowe na UART. Nie wgrywać na pompę podłączoną do co: tekst bez zapytania psuje magistralę.
[env:wokwi]
extends = env:promini
build_flags = -D RS485_HUMAN=2

; Firmware diagnostyczny: jak promini, plus log zdarzeń (linie JSON) na UART bez zapytania.
; Odczyt: tools/serial-log.ps1. Nie wgrywać na pompę podłączoną do co: log psuje magistralę.
[env:promini_debug]
extends = env:promini
build_flags = -D DEBUG_LOG

; Symulacja firmware na PC z atrapami sprzętu (test/sim_env): pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
test_ignore = test_chpc_debuglog
build_flags =
	-std=gnu++17
	-I test/sim_env
	-Wno-unused-variable
	-Wno-unused-but-set-variable
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-6

; Symulacja buildu diagnostycznego (DEBUG_LOG): pio test -e native_debug
[env:native_debug]
extends = env:native
test_ignore =
test_filter = test_chpc_debuglog
build_flags =
	${env:native.build_flags}
	-D DEBUG_LOG
