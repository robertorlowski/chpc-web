; Sterownik wlacznika (typ switch): plytka ESP32 z przekaznikiem i zasilaczem 230 V
; (ESP32-WROOM-32E, "ESP32 Relay AC X1"). Opis: README.md i docs/.

[platformio]
; Srodowisko native istnieje tylko dla `pio test -e native`.
default_envs = esp32dev

; Konsola i wgrywanie przez zlacze P1 (GND, RX, TX, 3V3) i przejsciowke USB-TTL;
; przekaznik na GPIO17 (firmware.hpp).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
	Links2004/WebSockets@^2.3.6

; Test z lokalnym serwerem (npm run local) w tej samej sieci: adres komputera z serwerem.
; Nie do wdrozenia: obraz z tego srodowiska nie laczy sie z produkcja.
[env:esp32dev-local]
extends = env:esp32dev
build_flags = '-D SWITCH_CLOUD_URL="http://192.168.55.9:4001/api/"'

[env:native]
platform = native
test_framework = unity
; Testy wlaczaja potrzebne pliki .cpp bezposrednio, wiec src nie jest budowane.
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src
	-Wall
	-Wextra
lib_deps = bblanchon/ArduinoJson@^7.3.0
