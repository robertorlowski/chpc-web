<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Wariant bez konwertera poziomów: dzielnik 10k/20k na odbiorze (5 V → 3,3 V), rezystor szeregowy 1k na nadawaniu (3,3 V wprost). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Sterownik klimatyzacji: wariant z dzielnikiem (bez konwertera)</text>
  <text x="500" y="58" text-anchor="middle" fill="#4b5563">UART Gree 4800 8E1, logika 5 V · projekt, kolejność pinów gniazda do zmierzenia</text>

  <!-- Klimatyzator -->
  <rect x="30" y="100" width="220" height="370" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="360" text-anchor="middle" font-weight="600" fill="#1e3a8a">Sinclair SIM-12BS3</text>
  <text x="140" y="380" text-anchor="middle" fill="#1e3a8a">gniazdo modułu Wi-Fi</text>
  <text x="140" y="404" text-anchor="middle" font-size="12" fill="#b91c1c">kolejność pinów zmierzyć</text>
  <g font-size="13" fill="#111827">
    <text x="240" y="145" text-anchor="end">+5V</text>
    <text x="240" y="225" text-anchor="end">RX (do klimatyzatora)</text>
    <text x="240" y="305" text-anchor="end">TX (z klimatyzatora)</text>
    <text x="240" y="435" text-anchor="end">GND</text>
  </g>

  <!-- ESP32-C3 -->
  <rect x="760" y="100" width="210" height="370" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="865" y="380" text-anchor="middle" font-weight="600" fill="#7c2d12">ESP32-C3 SuperMini</text>
  <text x="865" y="400" text-anchor="middle" font-size="12" fill="#7c2d12">jak w sterowniku pieca</text>
  <g font-size="13" fill="#111827">
    <text x="770" y="145">5V</text>
    <text x="770" y="225">GPIO20 (TX, UART1)</text>
    <text x="770" y="305">GPIO21 (RX, UART1)</text>
    <text x="770" y="435">GND</text>
  </g>

  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- +5V przez D1 -->
    <line x1="250" y1="140" x2="640" y2="140" stroke="#dc2626"/>
    <line x1="690" y1="140" x2="760" y2="140" stroke="#dc2626"/>
    <!-- nadawanie: GPIO20 → R3 → RX klimatyzatora -->
    <line x1="760" y1="220" x2="530" y2="220"/>
    <line x1="470" y1="220" x2="252" y2="220" marker-end="url(#arr)"/>
    <!-- odbiór: TX klimatyzatora → R1 → węzeł → GPIO21 -->
    <line x1="250" y1="300" x2="400" y2="300"/>
    <line x1="460" y1="300" x2="758" y2="300" marker-end="url(#arr)"/>
    <!-- R2 do masy -->
    <line x1="580" y1="300" x2="580" y2="335"/>
    <line x1="580" y1="395" x2="580" y2="430"/>
    <!-- masa -->
    <line x1="250" y1="430" x2="760" y2="430"/>
    <!-- C1 -->
    <line x1="725" y1="140" x2="725" y2="160" stroke="#dc2626"/>
    <line x1="712" y1="160" x2="738" y2="160"/>
    <path d="M712,170 Q725,163 738,170"/>
    <line x1="725" y1="167" x2="725" y2="180"/>
    <line x1="713" y1="180" x2="737" y2="180"/>
    <line x1="717" y1="185" x2="733" y2="185"/>
    <line x1="721" y1="190" x2="729" y2="190"/>
  </g>
  <!-- rezystory -->
  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <rect x="470" y="210" width="60" height="20"/>
    <rect x="400" y="290" width="60" height="20"/>
    <rect x="570" y="335" width="20" height="60"/>
  </g>
  <g font-size="13" fill="#111827">
    <text x="500" y="202" text-anchor="middle">R3 1 kΩ</text>
    <text x="430" y="282" text-anchor="middle">R1 10 kΩ</text>
    <text x="600" y="362">R2 20 kΩ</text>
    <text x="600" y="380" font-size="12" fill="#4b5563">5 V × 20/30 = 3,3 V</text>
  </g>
  <!-- D1 -->
  <path d="M640,128 L640,152 L684,140 z" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <line x1="688" y1="126" x2="688" y2="154" stroke="#1f2937" stroke-width="3"/>
  <text x="664" y="118" text-anchor="middle" font-size="12" fill="#111827">D1 SS14</text>
  <text x="745" y="168" font-size="12" fill="#111827">C1</text>
  <text x="745" y="182" font-size="11" fill="#4b5563">470 µF</text>
  <g fill="#1f2937">
    <circle cx="725" cy="140" r="4"/><circle cx="580" cy="300" r="4"/><circle cx="580" cy="430" r="4"/>
  </g>
  <text x="640" y="292" font-size="12" fill="#4b5563">≈ 3,3 V</text>
  <text x="640" y="212" font-size="12" fill="#4b5563">0 / 3,3 V</text>

  <g font-size="13" fill="#111827">
    <text x="30" y="515" font-weight="600">Uwagi</text>
    <text x="30" y="538">1. Odbiór: dzielnik R1/R2 obniża 5 V z linii klimatyzatora do ok. 3,3 V. Przy 4800 b/s rezystancje 10k/20k nie zniekształcają sygnału.</text>
    <text x="30" y="558">2. Nadawanie: GPIO20 podaje 3,3 V wprost. Działa, jeśli wejście klimatyzatora uznaje 3,3 V za stan wysoki (wejście TTL tak,</text>
    <text x="30" y="578">    wejście CMOS 5 V potrzebuje ok. 3,5 V). Do sprawdzenia przy pierwszej próbie; gdy nie zadziała, wraca konwerter BSS138.</text>
    <text x="30" y="598">3. R3 ogranicza prąd z podciągnięcia 5 V po stronie klimatyzatora do pinu ESP32-C3, który nie toleruje 5 V.</text>
    <text x="30" y="618">4. D1 i C1 jak w wariancie z konwerterem: dioda chroni klimatyzator przed zasilaniem z USB, kondensator na szczyty Wi-Fi.</text>
    <text x="30" y="638">5. Przed otwarciem obudowy odłączyć 230 V. USB z komputera tylko przy klimatyzatorze odłączonym od sieci,</text>
    <text x="30" y="658">    dopóki nie sprawdzono, że masa gniazda jest odizolowana od sieci.</text>
  </g>
</svg>
