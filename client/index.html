<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- ikona aplikacji (public/icon.svg, 2026-10-20; PNG 192 / 512 i maskable od 2026-10-21 — Chrome i Android wymagają PNG
         do instalacji) i manifest do „Dodaj do ekranu głównego” (PWA; service worker public/sw.js rejestruje index.tsx) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="My Home" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0f12" />
    <title>My Home</title>
    <!-- motyw przed pierwszym rysowaniem (jak core/theme.ts): bez wyboru jasny, „system” bez data-theme -->
    <script>
      try { var t = localStorage.getItem('chpc.theme'); if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
    <!-- język przed pierwszym rysowaniem (jak core/i18n): wybór z localStorage, inaczej z przeglądarki (pl-* = polski, reszta angielski) -->
    <script>
      try { var l = localStorage.getItem('chpc.lang'); if (l !== 'pl' && l !== 'en') l = (navigator.language || '').toLowerCase().indexOf('pl') === 0 ? 'pl' : 'en'; document.documentElement.setAttribute('lang', l); }
      catch (e) { document.documentElement.setAttribute('lang', 'pl'); }
    </script>
    <!-- krój aplikacji (kierunek B z makiet/): Barlow, liczby w Barlow Semi Condensed; bez sieci zostaje czcionka systemowa -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
